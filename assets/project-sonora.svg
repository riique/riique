<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="t d">
  <title id="t">Sonora v2.0</title>
  <desc id="d">Voice typing for Windows: global shortcuts, transcription, refinement, and speaking habits. Built with Tauri, Rust, React, TypeScript.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0717"/>
      <stop offset="0.55" stop-color="#120a24"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#f472b6" stop-opacity="0.32"/><stop offset="0.6" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="520" height="210" rx="18"/></clipPath>
    <style>
      .title { font: 750 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
      .desc { font: 400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #b4b4c6; }
      .chip { font: 600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .link { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #f472b6; letter-spacing: 1px; }
      .glow { animation: pulse 5s ease-in-out infinite alternate; }
      .eq { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .steam { animation: steam 2.4s ease-in-out infinite; }
      .spin { animation: spin 14s linear infinite; }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
      @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
      @keyframes steam { 0%, 100% { opacity: 0.2; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-1px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="520" height="210" fill="url(#bg)"/>
    <rect width="520" height="210" fill="url(#dots)"/>
    <rect class="glow" width="520" height="210" fill="url(#glow)"/>
    <rect width="520" height="3" fill="url(#top)"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="209" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(28 26)">
    <rect width="48" height="48" rx="13" fill="#f472b6" fill-opacity="0.14" stroke="#f472b6" stroke-opacity="0.5"/>
    <g transform="translate(24 24)" color="#f472b6" style="color:#f472b6"><rect class="eq" style="animation-delay:0.00s" x="-14" y="-12" width="3.5" height="24" rx="1.75" fill="currentColor"/><rect class="eq" style="animation-delay:0.15s" x="-8" y="-12" width="3.5" height="24" rx="1.75" fill="currentColor"/><rect class="eq" style="animation-delay:0.30s" x="-2" y="-12" width="3.5" height="24" rx="1.75" fill="currentColor"/><rect class="eq" style="animation-delay:0.45s" x="4" y="-12" width="3.5" height="24" rx="1.75" fill="currentColor"/><rect class="eq" style="animation-delay:0.60s" x="10" y="-12" width="3.5" height="24" rx="1.75" fill="currentColor"/></g>
  </g>
  <text x="92" y="58" class="title">Sonora v2.0</text>
  <text x="492" y="44" text-anchor="end" class="link">VIEW &#8599;</text>
  <text x="28" y="112" class="desc">Voice typing for Windows: global shortcuts,</text><text x="28" y="134" class="desc">transcription, refinement, and speaking habits.</text>
  <g transform="translate(28 160)"><rect width="59" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.35"/><text x="30" y="17.5" text-anchor="middle" class="chip">Tauri</text></g><g transform="translate(95 160)"><rect width="52" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.35"/><text x="26" y="17.5" text-anchor="middle" class="chip">Rust</text></g><g transform="translate(155 160)"><rect width="59" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.35"/><text x="30" y="17.5" text-anchor="middle" class="chip">React</text></g><g transform="translate(222 160)"><rect width="94" height="26" rx="13" fill="#f472b6" fill-opacity="0.1" stroke="#f472b6" stroke-opacity="0.35"/><text x="47" y="17.5" text-anchor="middle" class="chip">TypeScript</text></g>
</svg>
