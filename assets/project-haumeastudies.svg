<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="t d">
  <title id="t">HaumeaStudies</title>
  <desc id="d">Organizes study missions, mock exams, essays, mistakes, and review sessions. Built with Next.js, TypeScript, Firebase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0717"/>
      <stop offset="0.55" stop-color="#120a24"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#fbbf24" stop-opacity="0.32"/><stop offset="0.6" stop-color="#fbbf24" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="520" height="210" rx="18"/></clipPath>
    <style>
      .title { font: 750 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
      .desc { font: 400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #b4b4c6; }
      .chip { font: 600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .link { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #fbbf24; letter-spacing: 1px; }
      .glow { animation: pulse 5s ease-in-out infinite alternate; }
      .eq { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .steam { animation: steam 2.4s ease-in-out infinite; }
      .spin { animation: spin 14s linear infinite; }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
      @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
      @keyframes steam { 0%, 100% { opacity: 0.2; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-1px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="520" height="210" fill="url(#bg)"/>
    <rect width="520" height="210" fill="url(#dots)"/>
    <rect class="glow" width="520" height="210" fill="url(#glow)"/>
    <rect width="520" height="3" fill="url(#top)"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="209" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(28 26)">
    <rect width="48" height="48" rx="13" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5"/>
    <g transform="translate(24 24)" color="#fbbf24" style="color:#fbbf24"><path d="M0 -10 C-5 -13 -10 -13 -15 -11 L-15 11 C-10 9 -5 9 0 12 C5 9 10 9 15 11 L15 -11 C10 -13 5 -13 0 -10 Z M0 -10 L0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></g>
  </g>
  <text x="92" y="58" class="title">HaumeaStudies</text>
  <text x="492" y="44" text-anchor="end" class="link">VIEW &#8599;</text>
  <text x="28" y="112" class="desc">Organizes study missions, mock exams, essays,</text><text x="28" y="134" class="desc">mistakes, and review sessions.</text>
  <g transform="translate(28 160)"><rect width="73" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="36" y="17.5" text-anchor="middle" class="chip">Next.js</text></g><g transform="translate(109 160)"><rect width="94" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="47" y="17.5" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(211 160)"><rect width="80" height="26" rx="13" fill="#fbbf24" fill-opacity="0.1" stroke="#fbbf24" stroke-opacity="0.35"/><text x="40" y="17.5" text-anchor="middle" class="chip">Firebase</text></g>
</svg>
