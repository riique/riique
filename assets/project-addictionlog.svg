<svg xmlns="http://www.w3.org/2000/svg" width="520" height="210" viewBox="0 0 520 210" role="img" aria-labelledby="t d">
  <title id="t">AddictionLog</title>
  <desc id="d">Tracks caffeine, alcohol, and habits, estimates active load, and shows patterns over time. Built with React, TypeScript, Vite, Firebase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0717"/>
      <stop offset="0.55" stop-color="#120a24"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="1" cy="0" r="1"><stop offset="0" stop-color="#fb7185" stop-opacity="0.32"/><stop offset="0.6" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></linearGradient>
    <clipPath id="clip"><rect width="520" height="210" rx="18"/></clipPath>
    <style>
      .title { font: 750 24px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; letter-spacing: -0.3px; }
      .desc { font: 400 15px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #b4b4c6; }
      .chip { font: 600 12.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #e5e7eb; }
      .link { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #fb7185; letter-spacing: 1px; }
      .glow { animation: pulse 5s ease-in-out infinite alternate; }
      .eq { animation: eq 1.1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      .steam { animation: steam 2.4s ease-in-out infinite; }
      .spin { animation: spin 14s linear infinite; }
      @keyframes pulse { from { opacity: 0.6; } to { opacity: 1; } }
      @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
      @keyframes steam { 0%, 100% { opacity: 0.2; transform: translateY(2px); } 50% { opacity: 1; transform: translateY(-1px); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="520" height="210" fill="url(#bg)"/>
    <rect width="520" height="210" fill="url(#dots)"/>
    <rect class="glow" width="520" height="210" fill="url(#glow)"/>
    <rect width="520" height="3" fill="url(#top)"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="209" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>

  <g transform="translate(28 26)">
    <rect width="48" height="48" rx="13" fill="#fb7185" fill-opacity="0.14" stroke="#fb7185" stroke-opacity="0.5"/>
    <g transform="translate(24 24)" color="#fb7185" style="color:#fb7185"><path d="M-12 -4 L8 -4 L6 12 L-10 12 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M8 0 C14 0 14 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2"/><path class="steam" d="M-6 -9 C-8 -12 -4 -13 -6 -16 M0 -9 C-2 -12 2 -13 0 -16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></g>
  </g>
  <text x="92" y="58" class="title">AddictionLog</text>
  <text x="492" y="44" text-anchor="end" class="link">VIEW &#8599;</text>
  <text x="28" y="112" class="desc">Tracks caffeine, alcohol, and habits, estimates</text><text x="28" y="134" class="desc">active load, and shows patterns over time.</text>
  <g transform="translate(28 160)"><rect width="59" height="26" rx="13" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.35"/><text x="30" y="17.5" text-anchor="middle" class="chip">React</text></g><g transform="translate(95 160)"><rect width="94" height="26" rx="13" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.35"/><text x="47" y="17.5" text-anchor="middle" class="chip">TypeScript</text></g><g transform="translate(197 160)"><rect width="52" height="26" rx="13" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.35"/><text x="26" y="17.5" text-anchor="middle" class="chip">Vite</text></g><g transform="translate(257 160)"><rect width="80" height="26" rx="13" fill="#fb7185" fill-opacity="0.1" stroke="#fb7185" stroke-opacity="0.35"/><text x="40" y="17.5" text-anchor="middle" class="chip">Firebase</text></g>
</svg>
