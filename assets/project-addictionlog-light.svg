<svg xmlns="http://www.w3.org/2000/svg" width="520" height="232" viewBox="0 0 520 232" role="img" aria-labelledby="t d">
  <title id="t">AddictionLog</title>
  <desc id="d">Tracks caffeine, alcohol, and habits, estimates active load, and surfaces patterns over time. Built with React, TypeScript, Vite, Firebase.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0a0a0a" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    <radialGradient id="sheen" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.03"/><stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="accentGlow" cx="0.08" cy="0.12" r="0.65">
      <stop offset="0" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="520" height="232" rx="18"/></clipPath>
    <style>
      .idx { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #737373; letter-spacing: 1.5px; }
      .tag { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #404040; letter-spacing: 1.3px; }
      .title { font: 700 25px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; letter-spacing: -0.6px; }
      .desc { font: 400 15px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #525252; }
      .stack { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #404040; letter-spacing: 0.6px; }
      .arrow { font: 400 20px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; }
      .eq { animation: eq 1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="520" height="232" fill="#ffffff"/>
    <rect width="520" height="232" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="520" height="232" fill="url(#sheen)"/>
    <rect width="520" height="232" fill="url(#accentGlow)"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="231" rx="18" fill="none" stroke="#e5e5e5"/>

  <g transform="translate(32 30)">
    <rect width="44" height="44" rx="11" fill="#f5f5f5" stroke="#d4d4d4"/>
    <g transform="translate(22 22)"><path d="M-13 2 H-6 L-3 -7 L1 9 L4 -2 L6 2 H13" fill="none" stroke="#d97706" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></g>
  </g>
  <text x="92" y="50" class="idx">05</text>
  <text x="92" y="74" class="title">AddictionLog</text>
  <g transform="translate(344 34)">
    <rect width="144" height="24" rx="12" fill="#fafafa" stroke="#d4d4d4" stroke-opacity="1"/>
    <text x="72" y="16" text-anchor="middle" class="tag">HEALTH TRACKING</text>
  </g>
  <text x="32" y="126" class="desc">Tracks caffeine, alcohol, and habits, estimates</text>
  <text x="32" y="149" class="desc">active load, and surfaces patterns over time.</text>
  <rect x="32" y="182" width="456" height="1" fill="#e5e5e5"/>
  <text x="32" y="210" class="stack">React<tspan fill="#a3a3a3"> / </tspan>TypeScript<tspan fill="#a3a3a3"> / </tspan>Vite<tspan fill="#a3a3a3"> / </tspan>Firebase</text>
  <text x="488" y="212" text-anchor="end" class="arrow">&#8599;</text>
</svg>
