<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="378" viewBox="0 0 1000 378" role="img" aria-labelledby="t d">
  <title id="t">Token Maxxing Department</title>
  <desc id="d">short prompts sent: statistically irrelevant; context windows filled: too many; &quot;just one more feature&quot;: has never been just one; models consulted: yes; tokens saved: future goal; projects that started as a test: almost all of them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0717"/>
      <stop offset="0.55" stop-color="#120a24"/>
      <stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="clip"><rect width="1000" height="378" rx="18"/></clipPath>
    <style>
      .t { font: 500 17px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; white-space: pre; }
      .bar { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b8ba3; }
      .ln { opacity: 0; animation: in 0.45s ease-out forwards; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .ln { animation: none; opacity: 1; } .blink { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="378" fill="url(#bg)"/>
    <rect width="1000" height="378" fill="url(#dots)"/>
    <rect width="1000" height="46" fill="#ffffff" fill-opacity="0.04"/>
    <rect y="46" width="1000" height="1" fill="#ffffff" fill-opacity="0.08"/>
  </g>
  <rect x="0.5" y="0.5" width="999" height="377" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.09"/>
  <circle cx="26" cy="23" r="6" fill="#ff5f57"/><circle cx="46" cy="23" r="6" fill="#febc2e"/><circle cx="66" cy="23" r="6" fill="#28c840"/>
  <text x="500.0" y="28" text-anchor="middle" class="bar">token-maxxing-department — zsh</text>

  <text x="48" y="84" class="t"><tspan fill="#4ade80">riique</tspan><tspan fill="#6b7280">@</tspan><tspan fill="#c084fc">lab</tspan> <tspan fill="#6b7280">~</tspan> <tspan fill="#e5e7eb">$ token-audit --honest</tspan></text>
  <g class="ln" style="animation-delay:0.60s"><text x="48" y="126" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">short prompts sent</tspan> <tspan fill="#3f3f55">..................</tspan> <tspan fill="#c084fc" font-weight="700">statistically irrelevant</tspan></text></g><g class="ln" style="animation-delay:0.95s"><text x="48" y="160" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">context windows filled</tspan> <tspan fill="#3f3f55">..............</tspan> <tspan fill="#f87171" font-weight="700">too many</tspan></text></g><g class="ln" style="animation-delay:1.30s"><text x="48" y="194" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">&quot;just one more feature&quot;</tspan> <tspan fill="#3f3f55">.............</tspan> <tspan fill="#fbbf24" font-weight="700">has never been just one</tspan></text></g><g class="ln" style="animation-delay:1.65s"><text x="48" y="228" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">models consulted</tspan> <tspan fill="#3f3f55">....................</tspan> <tspan fill="#4ade80" font-weight="700">yes</tspan></text></g><g class="ln" style="animation-delay:2.00s"><text x="48" y="262" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">tokens saved</tspan> <tspan fill="#3f3f55">........................</tspan> <tspan fill="#38bdf8" font-weight="700">future goal</tspan></text></g><g class="ln" style="animation-delay:2.35s"><text x="48" y="296" class="t"><tspan fill="#6b7280">&#8250;</tspan> <tspan fill="#e5e7eb">projects that started as a test</tspan> <tspan fill="#3f3f55">.....</tspan> <tspan fill="#f472b6" font-weight="700">almost all of them</tspan></text></g>
  <g class="ln" style="animation-delay:2.70s">
    <text x="48" y="340" class="t"><tspan fill="#4ade80">riique</tspan><tspan fill="#6b7280">@</tspan><tspan fill="#c084fc">lab</tspan> <tspan fill="#6b7280">~</tspan> <tspan fill="#e5e7eb">$</tspan></text>
    <rect class="blink" x="204" y="325" width="10" height="19" fill="#a855f7"/>
  </g>
</svg>
