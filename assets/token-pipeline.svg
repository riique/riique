<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="token-pipeline-title token-pipeline-description">
  <title id="token-pipeline-title">Token Maxxing pipeline</title>
  <desc id="token-pipeline-description">An idea becomes an unnecessarily detailed prompt, pushes the context into critical condition, produces something that more or less works, and increases the scope before returning for more tokens.</desc>
  <defs>
    <style>
      .flow-line { stroke: #57606a; }
      .flow-arrow { fill: #57606a; }
      .loop-line { stroke: #8250df; }
      .loop-arrow, .loop-label { fill: #8250df; }

      @media (prefers-color-scheme: dark) {
        .flow-line { stroke: #8b949e; }
        .flow-arrow { fill: #8b949e; }
        .loop-line { stroke: #c4b5fd; }
        .loop-arrow, .loop-label { fill: #c4b5fd; }
      }
    </style>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- ========== boxes ========== -->
  <g filter="url(#soft)">
    <rect x="24" y="72" width="128" height="68" rx="12" fill="#4c1d95" stroke="#c4b5fd" stroke-width="2"/>
    <text x="88" y="113" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700">IDEA</text>
  </g>

  <g filter="url(#soft)">
    <rect x="210" y="56" width="168" height="100" rx="12" fill="#1e3a8a" stroke="#93c5fd" stroke-width="2"/>
    <text x="294" y="96" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">PROMPT</text>
    <text x="294" y="118" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">unnecessarily</text>
    <text x="294" y="134" text-anchor="middle" fill="#dbeafe" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">detailed</text>
  </g>

  <g filter="url(#soft)">
    <rect x="436" y="56" width="158" height="100" rx="12" fill="#7f1d1d" stroke="#fca5a5" stroke-width="2"/>
    <text x="515" y="96" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">CONTEXT</text>
    <text x="515" y="118" text-anchor="middle" fill="#fee2e2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">in critical</text>
    <text x="515" y="134" text-anchor="middle" fill="#fee2e2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">condition</text>
  </g>

  <g filter="url(#soft)">
    <rect x="652" y="56" width="158" height="100" rx="12" fill="#14532d" stroke="#86efac" stroke-width="2"/>
    <text x="731" y="96" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">PRODUCT</text>
    <text x="731" y="118" text-anchor="middle" fill="#dcfce7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">more or less</text>
    <text x="731" y="134" text-anchor="middle" fill="#dcfce7" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11">working</text>
  </g>

  <g filter="url(#soft)">
    <rect x="868" y="56" width="112" height="100" rx="12" fill="#7c2d12" stroke="#fdba74" stroke-width="2"/>
    <text x="924" y="90" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">SCOPE</text>
    <text x="924" y="108" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700">INCREASE</text>
    <text x="924" y="132" text-anchor="middle" fill="#ffedd5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">"since we're</text>
    <text x="924" y="146" text-anchor="middle" fill="#ffedd5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10">here..."</text>
  </g>

  <!-- ========== forward connectors (line ends at triangle BASE center) ========== -->
  <!-- box edges: 152 | 210 · 378 | 436 · 594 | 652 · 810 | 868 -->
  <!-- each: line to base center, triangle tip almost touches next box -->

  <!-- IDEA -> PROMPT -->
  <line class="flow-line" x1="152" y1="106" x2="190" y2="106" stroke-width="2.5" stroke-linecap="butt"/>
  <polygon class="flow-arrow" points="190,100 190,112 204,106"/>

  <!-- PROMPT -> CONTEXT -->
  <line class="flow-line" x1="378" y1="106" x2="416" y2="106" stroke-width="2.5" stroke-linecap="butt"/>
  <polygon class="flow-arrow" points="416,100 416,112 430,106"/>

  <!-- CONTEXT -> PRODUCT -->
  <line class="flow-line" x1="594" y1="106" x2="632" y2="106" stroke-width="2.5" stroke-linecap="butt"/>
  <polygon class="flow-arrow" points="632,100 632,112 646,106"/>

  <!-- PRODUCT -> SCOPE -->
  <line class="flow-line" x1="810" y1="106" x2="848" y2="106" stroke-width="2.5" stroke-linecap="butt"/>
  <polygon class="flow-arrow" points="848,100 848,112 862,106"/>

  <!-- ========== feedback loop ========== -->
  <!--
    Path ends EXACTLY at the midpoint of the triangle base.
    Triangle points UP into PROMPT (bottom center x=294).
    Base is horizontal; tip is above base.
    Line does NOT pass through the triangle body.
  -->
  <!-- tip of arrow (below PROMPT box bottom y=156) -->
  <!-- base y = 178, tip y = 160, base half-width = 9 -->
  <path
    class="loop-line"
    d="M 924 156
       L 924 178
       C 924 218, 294 218, 294 178"
    fill="none"
    stroke-width="2.5"
    stroke-dasharray="7 6"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />
  <!-- base center = (294, 178) = path end; tip = (294, 160) -->
  <polygon class="loop-arrow" points="294,160 285,178 303,178"/>

  <!-- label BELOW the dashed arc (arc bottom ~ y=218) -->
  <text
    class="loop-label"
    x="609"
    y="248"
    text-anchor="middle"
    font-family="Segoe UI, Helvetica, Arial, sans-serif"
    font-size="13"
    font-style="italic"
  >more tokens</text>
</svg>
