<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="t d">
  <title id="t">Thanks for stopping by.</title>
  <desc id="d">Idea, specification, product. Built with AI, reviewed by hand.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    <radialGradient id="sheen" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="132" rx="20"/></clipPath>
    <style>
      .big { font: 700 26px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.6px; }
      .small { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8a8a8a; letter-spacing: 1px; }
      .scan { animation: scan 6s ease-in-out infinite alternate; }
      @keyframes scan { to { transform: translateX(1000px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="132" fill="#0a0a0a"/>
    <rect width="1200" height="132" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="1200" height="132" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="131" rx="20" fill="none" stroke="#262626"/>

  <text x="48" y="62" class="big">Thanks for stopping by.</text>
  <text x="48" y="92" class="small">IDEA → SPEC → PRODUCT</text>
  <text x="1152" y="62" text-anchor="end" class="small">GITHUB.COM/RIIQUE</text>
  <text x="1152" y="92" text-anchor="end" class="small" fill="#5a5a5a" style="fill:#5a5a5a">BUILT WITH AI · REVIEWED BY HAND</text>
  <rect class="scan" x="48" y="130" width="104" height="2" fill="#ffffff"/>
</svg>
