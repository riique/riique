<svg xmlns="http://www.w3.org/2000/svg" width="520" height="232" viewBox="0 0 520 232" role="img" aria-labelledby="t d">
  <title id="t">TelegramCloner</title>
  <desc id="d">Clones and synchronizes Telegram channels, groups, and forums with interruption-safe checkpoints. Built with Electron, React, Python, Telethon.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    <radialGradient id="sheen" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="520" height="232" rx="18"/></clipPath>
    <style>
      .idx { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8a8a8a; letter-spacing: 1.5px; }
      .tag { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #d4d4d4; letter-spacing: 1.4px; }
      .title { font: 700 25px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -0.6px; }
      .desc { font: 400 15px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #a3a3a3; }
      .stack { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #d4d4d4; letter-spacing: 0.6px; }
      .arrow { font: 400 20px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; }
      .eq { animation: eq 1s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
      @keyframes eq { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="520" height="232" fill="#0a0a0a"/>
    <rect width="520" height="232" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="520" height="232" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="519" height="231" rx="18" fill="none" stroke="#262626"/>

  <g transform="translate(32 30)">
    <rect width="44" height="44" rx="11" fill="#141414" stroke="#333"/>
    <g transform="translate(22 22)"><path d="M-12 -1 L12 -10 L7 11 L-1 3 Z M-1 3 L12 -10 M-1 3 L-1 9 L3 6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/></g>
  </g>
  <text x="92" y="50" class="idx">02</text>
  <text x="92" y="74" class="title">TelegramCloner</text>
  <g transform="translate(382 34)">
    <rect width="106" height="24" rx="12" fill="none" stroke="#3a3a3a"/>
    <text x="53" y="16" text-anchor="middle" class="tag">DESKTOP APP</text>
  </g>
  <text x="32" y="126" class="desc">Clones and synchronizes Telegram channels, groups,</text><text x="32" y="149" class="desc">and forums with interruption-safe checkpoints.</text>
  <rect x="32" y="182" width="456" height="1" fill="#262626"/>
  <text x="32" y="210" class="stack">Electron<tspan fill="#555"> / </tspan>React<tspan fill="#555"> / </tspan>Python<tspan fill="#555"> / </tspan>Telethon</text>
  <text x="488" y="212" text-anchor="end" class="arrow">&#8599;</text>
</svg>
