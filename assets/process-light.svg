<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="264" viewBox="0 0 1200 264" role="img" aria-labelledby="t d">
  <title id="t">How I work</title>
  <desc id="d">01 Problem: start from a real need, not a feature list. 02 Specification: define scope, architecture, and acceptance criteria. 03 Build: implement with AI and review every decision. 04 Iterate: test, measure, refine, and ship.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#0a0a0a" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    <radialGradient id="sheen" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#0a0a0a" stop-opacity="0.03"/><stop offset="1" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="264" rx="20"/></clipPath>
    <style>
      .label { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #737373; letter-spacing: 2px; }
      .num { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #737373; letter-spacing: 1.5px; }
      .step { font: 700 21px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0a0a0a; letter-spacing: -0.4px; }
      .sub { font: 400 15px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #525252; }
      .run { animation: run 3.6s cubic-bezier(.65,0,.35,1) infinite; }
      .dot { animation: dot 3.6s ease-in-out infinite; opacity: 0.25; }
      @keyframes run { from { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } to { transform: translateX(1022px); opacity: 0; } }
      @keyframes dot { 0%, 100% { opacity: 0.25; } 20% { opacity: 1; } 40% { opacity: 0.25; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="264" fill="#ffffff"/>
    <rect width="1200" height="264" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="1200" height="264" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="263" rx="20" fill="none" stroke="#e5e5e5"/>

  <text x="56" y="44" class="label">HOW I WORK</text>
  <rect x="62" y="104" width="1082" height="1" fill="#d4d4d4"/>
  <rect class="run" x="62" y="103.5" width="60" height="2" fill="#0a0a0a"/>
  <circle cx="62" cy="104" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle class="dot" style="animation-delay:0.0s" cx="62" cy="104" r="2.5" fill="#16a34a"/>
  <text x="56" y="78" class="num">01</text>
  <text x="56" y="152" class="step">Problem</text>
  <text x="56" y="186" class="sub">Start from a real need,</text>
  <text x="56" y="208" class="sub">not a feature list.</text>
  <circle cx="350" cy="104" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle class="dot" style="animation-delay:0.9s" cx="350" cy="104" r="2.5" fill="#16a34a"/>
  <text x="344" y="78" class="num">02</text>
  <text x="344" y="152" class="step">Specification</text>
  <text x="344" y="186" class="sub">Define scope, architecture,</text>
  <text x="344" y="208" class="sub">and acceptance criteria.</text>
  <circle cx="638" cy="104" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle class="dot" style="animation-delay:1.8s" cx="638" cy="104" r="2.5" fill="#16a34a"/>
  <text x="632" y="78" class="num">03</text>
  <text x="632" y="152" class="step">Build</text>
  <text x="632" y="186" class="sub">Implement with AI;</text>
  <text x="632" y="208" class="sub">review every decision.</text>
  <circle cx="926" cy="104" r="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1.5"/>
  <circle class="dot" style="animation-delay:2.7s" cx="926" cy="104" r="2.5" fill="#16a34a"/>
  <text x="920" y="78" class="num">04</text>
  <text x="920" y="152" class="step">Iterate</text>
  <text x="920" y="186" class="sub">Test, measure, refine,</text>
  <text x="920" y="208" class="sub">and ship.</text>
</svg>
