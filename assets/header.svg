<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">Henrique V. L.</title>
  <desc id="d">I design and ship software products end to end, using AI as my primary implementation tool. AI-assisted development, product engineering, and automation.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="fade" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="100%" height="100%" fill="url(#fade)"/></mask>
    <radialGradient id="sheen" cx="0.15" cy="0" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="380" rx="24"/></clipPath>
    <style>
      .kicker { font: 500 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8a8a8a; letter-spacing: 1px; }
      .name { font: 700 68px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -2.5px; }
      .lead { font: 400 23px 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #bdbdbd; letter-spacing: -0.2px; }
      .area { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #e5e5e5; letter-spacing: 1.6px; }
      .status { font: 500 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8a8a8a; letter-spacing: 1px; }
      .o1 { animation: spin 9s linear infinite; }
      .o2 { animation: spin 16s linear infinite reverse; }
      .o3 { animation: spin 28s linear infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="#0a0a0a"/>
    <rect width="1200" height="380" fill="url(#grid)" mask="url(#gridmask)"/>
    <rect width="1200" height="380" fill="url(#sheen)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="24" fill="none" stroke="#262626"/>

  <text x="72" y="96" class="kicker">~/riique<tspan fill="#ffffff"> $ whoami</tspan></text>
  <rect class="caret" x="244" y="83" width="8" height="16" fill="#ffffff"/>
  <text x="72" y="172" class="name">Henrique V. L.</text>
  <text x="72" y="220" class="lead">I design and ship software products end to end,</text>
  <text x="72" y="252" class="lead">using AI as my primary implementation tool.</text>
  <text x="72" y="304" class="area">AI-ASSISTED DEVELOPMENT</text><rect x="315" y="291" width="1" height="16" fill="#3a3a3a"/><text x="337" y="304" class="area">PRODUCT ENGINEERING</text><rect x="541" y="291" width="1" height="16" fill="#3a3a3a"/><text x="563" y="304" class="area">AUTOMATION</text>
  <circle class="pulse" cx="78" cy="340" r="4" fill="#ffffff"/>
  <text x="92" y="344" class="status">CURRENTLY BUILDING · HAUMEA ECOSYSTEM</text>

  <g transform="translate(960 190)">
    <circle r="150" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    <circle r="112" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-dasharray="2 6"/>
    <circle r="74" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
    <ellipse rx="30" ry="19" fill="#141414" stroke="#ffffff" stroke-opacity="0.85" stroke-width="1.5" transform="rotate(-18)"/>
    <ellipse rx="52" ry="12" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.2" transform="rotate(-18)"/>
    <g class="o1"><circle cx="74" cy="0" r="4" fill="#ffffff"/></g>
    <g class="o2"><circle cx="0" cy="-112" r="3" fill="#d4d4d4"/></g>
    <g class="o3"><circle cx="-150" cy="0" r="2.5" fill="#8a8a8a"/></g>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#ffffff" stroke-opacity="0.05"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#ffffff" stroke-opacity="0.05"/>
  </g>
</svg>
